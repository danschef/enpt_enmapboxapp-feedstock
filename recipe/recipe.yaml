schema_version: 1

context:
  name: enpt_enmapboxapp
  version: "1.2.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/enpt_enmapboxapp-${{ version }}.tar.gz
  sha256: 007ce00a79ccb1fa4ee5360ce4dfe9b12ef26aefa92d8919bbbb10f21a1248c4

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - packaging
    - setuptools
  run:
    - python >=${{ python_min }}
    - packaging
    - psutil

tests:
  - python:
      imports:
        - enpt_enmapboxapp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A QGIS EnMAPBox plugin providing a GUI for the EnMAP processing tool (EnPT).
  license: GPL-3.0-or-later
  license_file: LICENSE
  homepage: https://git.gfz-potsdam.de/EnMAP/GFZ_Tools_EnMAP_BOX/enpt_enmapboxapp

extra:
  recipe-maintainers:
    - danschef
