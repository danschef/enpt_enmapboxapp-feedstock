schema_version: 1

context:
  name: enpt_enmapboxapp
  version: "1.3.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/enpt_enmapboxapp-${{ version }}.tar.gz
  sha256: d44dee385a26b062c5c674518bed853bedb1c6fb215985c4c5ad3385e6a2a708

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - packaging
    - setuptools
  run:
    - python >=${{ python_min }}
    - packaging
    - psutil

tests:
  - python:
      imports:
        - enpt_enmapboxapp
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A QGIS EnMAPBox plugin providing a GUI for the EnMAP processing tool (EnPT).
  license: GPL-3.0-or-later
  license_file: LICENSE
  homepage: https://git.gfz-potsdam.de/EnMAP/GFZ_Tools_EnMAP_BOX/enpt_enmapboxapp

extra:
  recipe-maintainers:
    - danschef
